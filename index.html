<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>voley v1 - Marcador</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --team-a-color: #2196F3;
            --team-b-color: #FF5252;
            --text-color: #ffffff;
            --accent: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        .app-title {
            font-size: 1rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .set-indicator {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        .team-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-top: 8px solid transparent;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .team-a { border-top-color: var(--team-a-color); }
        .team-b { border-top-color: var(--team-b-color); }

        .team-header {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .team-name {
            background: transparent;
            border: none;
            border-bottom: 2px dashed #555;
            color: var(--text-color);
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            width: 75%;
            outline: none;
        }

        .team-name:focus {
            border-bottom-color: var(--accent);
        }

        .serve-icon {
            font-size: 1.8rem;
            opacity: 0.2;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            padding: 5px;
        }

        .serve-icon.active {
            opacity: 1;
            transform: scale(1.2);
        }

        .sets-won {
            font-size: 1.3rem;
            background: #2c2c2c;
            padding: 5px 20px;
            border-radius: 20px;
            margin: 10px 0;
        }

        .sets-won span {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.5rem;
        }

        .score {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin: 15px 0;
            cursor: pointer;
            user-select: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .btn-plus {
            font-size: 2.5rem;
            padding: 15px 40px;
            color: white;
            flex: 2;
        }

        .team-a .btn-plus { background-color: var(--team-a-color); }
        .team-b .btn-plus { background-color: var(--team-b-color); }

        .btn-minus {
            font-size: 1.8rem;
            padding: 15px 20px;
            background-color: #333;
            color: #ccc;
            flex: 1;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-action {
            background-color: #333;
            color: white;
            padding: 14px 22px;
            font-size: 1rem;
        }

        .btn-reset { background-color: #b71c1c; }

        .history {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            font-size: 0.95rem;
        }

        @media (max-width: 650px) {
            .board { grid-template-columns: 1fr; }
            .score { font-size: 5.5rem; }
            .team-name { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">voley v1</div>
        <div class="set-indicator" id="setDisplay">SET 1 (A 25 PUNTOS)</div>
    </header>

    <div class="board" id="board">
        <!-- Equipo Izquierda -->
        <div class="team-card team-a" id="cardLeft">
            <div class="team-header">
                <input type="text" class="team-name" id="nameLeft" value="LOCAL">
                <span class="serve-icon active" id="serveLeft" title="Indicador de saque">🏐</span>
            </div>
            <div class="sets-won">SETS: <span id="setsLeft">0</span></div>
            <div class="score" id="scoreLeft">0</div>
            <div class="controls">
                <button type="button" class="btn-minus" id="btnMinusLeft">-</button>
                <button type="button" class="btn-plus" id="btnPlusLeft">+</button>
            </div>
        </div>

        <!-- Equipo Derecha -->
        <div class="team-card team-b" id="cardRight">
            <div class="team-header">
                <span class="serve-icon" id="serveRight" title="Indicador de saque">🏐</span>
                <input type="text" class="team-name" id="nameRight" value="VISITA">
            </div>
            <div class="sets-won">SETS: <span id="setsRight">0</span></div>
            <div class="score" id="scoreRight">0</div>
            <div class="controls">
                <button type="button" class="btn-plus" id="btnPlusRight">+</button>
                <button type="button" class="btn-minus" id="btnMinusRight">-</button>
            </div>
        </div>
    </div>

    <div class="history" id="setHistory">Historial de sets: Ninguno</div>

    <div class="bottom-bar">
        <button type="button" class="btn-action" id="btnSwap">⇄ Cambiar Lado</button>
        <button type="button" class="btn-action" id="btnUndo">↩ Deshacer</button>
        <button type="button" class="btn-action btn-reset" id="btnReset">Reiniciar Partido</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let state = {
                left: { score: 0, sets: 0, colorClass: 'team-a' },
                right: { score: 0, sets: 0, colorClass: 'team-b' },
                serve: 'left',
                currentSet: 1,
                history: [],
                undoStack: []
            };

            function saveState() {
                state.undoStack.push(JSON.parse(JSON.stringify({
                    left: state.left,
                    right: state.right,
                    serve: state.serve,
                    currentSet: state.currentSet,
                    history: state.history,
                    nameLeft: document.getElementById('nameLeft').value,
                    nameRight: document.getElementById('nameRight').value
                })));
                if (state.undoStack.length > 20) state.undoStack.shift();
            }

            function addPoint(side) {
                saveState();
                state[side].score++;
                state.serve = side;
                checkSetWin();
                updateUI();
            }

            function removePoint(side) {
                if (state[side].score > 0) {
                    saveState();
                    state[side].score--;
                    updateUI();
                }
            }

            function setServe(side) {
                state.serve = side;
                updateUI();
            }

            function checkSetWin() {
                const target = state.currentSet === 5 ? 15 : 25;
                const sLeft = state.left.score;
                const sRight = state.right.score;

                if ((sLeft >= target || sRight >= target) && Math.abs(sLeft - sRight) >= 2) {
                    const winner = sLeft > sRight ? 'left' : 'right';
                    const winnerName = document.getElementById(winner === 'left' ? 'nameLeft' : 'nameRight').value;
                    
                    state[winner].sets++;
                    state.history.push(`Set ${state.currentSet}: ${sLeft}-${sRight}`);
                    
                    setTimeout(() => {
                        alert(`¡${winnerName} gana el Set ${state.currentSet} (${sLeft} - ${sRight})!`);
                        
                        if (state[winner].sets === 3) {
                            alert(`🏆 ¡${winnerName} HA GANADO EL PARTIDO! 🏆`);
                        } else {
                            state.currentSet++;
                            state.left.score = 0;
                            state.right.score = 0;
                            swapSides(false);
                        }
                        updateUI();
                    }, 100);
                }
            }

            function swapSides(recordUndo = true) {
